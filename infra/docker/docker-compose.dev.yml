name: thepos-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thepos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thepos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-thepos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
