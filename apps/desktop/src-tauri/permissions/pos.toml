[[permission]]
identifier = "allow-pos-request"
description = "Permits the main window to call the fixed set of POS API operations."
commands.allow = ["pos_request", "brand_logo", "is_fullscreen", "set_fullscreen"]

[[permission]]
identifier = "allow-receipt-printing"
description = "Permits the local register to list Windows printer queues and submit receipt images."
commands.allow = ["receipt_printers", "print_receipt"]
